name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Takyon — traces conversations, LLM calls, and tool usage. Opt-in via `takyon plugins enable observability/langfuse` (or check the box in `takyon plugins`)."
author: NousResearch
requires_env:
  - TAKYON_LANGFUSE_PUBLIC_KEY
  - TAKYON_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
