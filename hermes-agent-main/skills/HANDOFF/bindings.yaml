artifacts:
  design.contract:
    paths: [product/site/DESIGN.md]
    publish: false
    receipt: artifact_digest
  design.web-images:
    paths: [product/site/public/generated]
    publish: true
    receipt: creative_receipt
  product.surface:
    paths: [product/surface.md, product/site]
    publish: true
    receipt: publication_receipt
    runtime_owned_paths:
      - product/site/index.html
      - product/site/public/robots.txt
      - product/site/public/sitemap.xml
      - product/site/public/llms.txt
      - product/site/src/main.tsx
      - product/site/src/index.css
      - product/site/src/lib/takyon.ts
      - product/site/src/lib/hooks.ts
      - product/site/src/lib/product-auth.tsx
      - product/site/src/lib/branding.ts
      - product/site/src/lib/interaction-sounds.ts
      - product/site/src/components/action-error-announcer.tsx
      - product/site/src/components/site-navigation.tsx
      - product/site/src/components/subscription-cancellation.tsx
      - product/site/src/screens/app-layout.tsx
      - product/site/src/screens/support.tsx
      - product/site/actions/_example-generate.ts
  product.mobile-app:
    paths: [product/surface.md, product/app]
    publish: true
    receipt: mobile_release_receipt
  metrics.seo-report:
    paths: [metrics/seo]
    publish: false
    receipt: artifact_digest
  creative.static-ads:
    paths: [product/static-ads]
    publish: true
    receipt: creative_receipt
  app.runtime-contract:
    paths: [product/surface.md]
    publish: false
    receipt: runtime_verification_receipt
  creative.brand-logo:
    paths: [product/brand/logos]
    publish: true
    receipt: creative_receipt
  metrics.business-summary:
    paths: [metrics/summary.md, metrics/summary.json, metrics/wake-history.md]
    publish: false
    receipt: artifact_digest
  distribution.campaign:
    paths: [distribution/surface.md, distribution/campaign, distribution/local-published]
    publish: false
    receipt: action_receipt
  creative.ugc-workflow:
    paths: [product/lightreel-seedance-fal-ugc-workflow.md]
    publish: false
    receipt: artifact_digest
  research.market:
    paths: [research/market.md, research/sources.jsonl, metrics/research-summary.json]
    publish: false
    receipt: artifact_digest
  distribution.meta-ads:
    paths: [distribution/meta-ads, metrics/meta-ads, metrics/meta-pixel]
    publish: true
    receipt: provider_action_receipt
  distribution.reddit-ads:
    paths: [product/public-assets, distribution/reddit-ads, metrics/reddit-ads]
    publish: true
    receipt: provider_action_receipt
  distribution.x:
    paths: [distribution/voice/x.md, distribution/campaign, distribution/local-published, metrics/conversations]
    publish: true
    receipt: provider_action_receipt
  creative.ugc-video:
    paths: [product/ugc-ads]
    publish: true
    receipt: creative_receipt

