schema_version: 1
retired_tools:
  business_claude_agent_task:
    replacement_capability: product.source.edit
    reason: The primary agent edits through guarded business-scoped file tools; no nested model is spawned.
retired_environment_requirements:
  TAKYON_GEMINI_API_KEY:
    replacement_capability: creative.logo.generate
    reason: The raw key remains inside Safebox and is never a skill or operator-runtime prerequisite.
  LIGHTREEL_API_KEY:
    replacement_capability: creative.ugc-workflow.compose
    reason: Live discovery remains fail-closed until a Safebox-gated capability replaces raw-key access.
  FAL_KEY:
    replacement_capability: creative.ugc-workflow.compose
    reason: Render authority remains behind Safebox and is not declared in portable skill metadata.
skills:
  surface-refresh-audit:
    required_tools: []
    allowed_roots:
    - product
    publication_paths:
    - product/site
  design-taste-frontend:
    required_tools: []
    allowed_roots:
    - product
    publication_paths:
    - product/site/DESIGN.md
    - product/site
  taste-imagegen-web:
    required_tools: []
    allowed_roots:
    - product
    publication_paths:
    - product/site/public/generated
  takyon-autonomous-seo-geo-operator:
    required_tools:
    - business_read_business
    - business_read_file
    - business_list_files
    - business_write_file
    - business_patch_file
    - business_claude_agent_task
    - business_refresh_product_surface
    - business_seo_query_data
    allowed_roots:
    - product
    - metrics
    publication_paths:
    - product/site
    - metrics/seo/seo-geo-report-<YYYY-MM-DD>.md
    routing:
      owns: Per-business search-visibility audits and bounded SEO/GEO improvements across product-site source, plus
        a canonical visibility report, with no paid APIs by default.
      when_to_use:
      - A business product/site needs improved search or AI-answer visibility through honest metadata, schema, internal-linking,
        sitemap, robots.txt, llms.txt, or a few BOFU pages.
      - The operator wants a small, reviewable SEO/GEO pass grounded in existing product truth and site source.
      - Optional GSC, Google Keyword Planner, OpenSEO, DataForSEO, or SERP context is available and should sharpen
        prioritization without blocking the run.
      do_not_use_for:
      - Off-page work needing real external action (backlink outreach, buying links, posting to social/forums) —
        out of scope.
      - Fabricating keyword volumes, rankings, reviews, testimonials, or competitor claims — explicitly forbidden,
        not a capability.
      - Claiming live ranking wins, deploy state, or merged publication without real evidence or receipts.
  takyon-static-ad-creative-generator:
    required_tools:
    - business_read_business
    - business_read_file
    - business_list_files
    - business_static_ad_generate
    allowed_roots:
    - product
    publication_paths:
    - product/static-ads/<slug>
    - product/static-ads/<slug>/manifest.json
    routing:
      owns: Per-business static performance-ad image creative generation from brief to spec, prompt, QA bundle,
        and live image render.
      when_to_use:
      - A business needs static image ad variants for Meta (Facebook/Instagram) or Reddit.
      - The operator wants multiple ad angles as reviewable specs before or alongside paid distribution work.
      - The business needs a batch creative test matrix with real OpenAI renders.
      do_not_use_for:
      - Generic or artistic image generation, logo/brand-identity design, or video ad creative.
      - Long-form landing-page or email copywriting (route to a copywriting skill).
      - Launching, managing, or pulling performance metrics from live ad accounts.
  takyon-app-runtime:
    required_tools:
    - business_read_business
    - business_read_file
    - business_write_file
    - business_patch_file
    - business_upsert_app_surface_contract
    - business_upsert_app_plan
    - business_supabase_login
    - business_create_app_checkout
    - business_check_runtime_capabilities
    - business_invoke_app_action
    - business_send_app_email
    - business_list_app_media
    allowed_roots:
    - product
    - metrics
    publication_paths:
    - product/surface.md
    routing:
      owns: auth, sessions, checkout, entitlements, billing, usage, backend product actions, and runtime wiring
        for the business app
      when_to_use:
      - real app customer state, pricing, checkout, or entitlements must be wired honestly
      - usage tracking or app budget gates materially affect the product
      - verifying or operating declared product actions before reporting a product workflow as working
      do_not_use_for:
      - pure page or layout work unless the runtime contract itself is changing
  takyon-brand-logo:
    required_tools:
    - business_read_business
    - business_read_file
    - business_list_files
    - business_generate_logo
    allowed_roots:
    - product
    publication_paths:
    - product/brand/logos/<slug>/logo.png
    - product/brand/logos/<slug>/receipt.json
    routing:
      owns: Per-business brand logo icon generation (flat vector, transparent background, icon-only) through the
        credit-gated logo authority route.
      when_to_use:
      - A business needs a brand logo / icon mark for its product site, app, or social profile.
      - The CEO is building or refreshing a business's brand identity and wants a real transparent-background logo
        asset.
      do_not_use_for:
      - Performance ad creative (route to takyon-static-ad-creative-generator).
      - Generic or artistic image generation, photo editing, or video creative.
      - Inventing brand voice, naming, or copy — that is operator-owned.
  takyon-business-metrics:
    required_tools:
    - business_calculate_pulse
    - business_read_business
    - business_read_file
    - business_write_file
    - business_patch_file
    - business_read_app_analytics
    allowed_roots:
    - metrics
    - research
    publication_paths:
    - metrics/summary.md
    - metrics/summary.json
    - metrics/wake-history.md
    routing:
      owns: metrics summaries, wake history, and unresolved inbound visibility
      when_to_use:
      - every `/wake` and the first `/create` baseline
      - current users, revenue, usage, or unresolved replies materially affect the next move
      do_not_use_for:
      - inventing strategy from missing metrics
  takyon-distribution:
    required_tools:
    - business_read_business
    - business_calculate_pulse
    - business_read_file
    - business_list_files
    - business_write_file
    - business_patch_file
    - business_create_workspace
    - business_publish_test_outreach
    - business_enqueue_job
    allowed_roots:
    - distribution
    - metrics
    - research
    publication_paths:
    - distribution/surface.md
    - distribution/campaign
    - distribution/local-published
    routing:
      owns: campaign work, lane planning, campaign artifacts, and broader demand-creation coordination
      when_to_use:
      - the business needs outbound demand creation or campaign iteration
      - the operator asks to launch, continue, or review outreach or campaigns
      do_not_use_for:
      - channel-native X drafting or X thread handling
      - channel-owned Reddit execution, including organic Reddit posting/comments and paid Reddit ad launch/control/metrics
        work
      - live paid Meta ad execution
      - live paid Reddit ad execution
      - product-surface changes
  takyon-lightreel-seedance-fal-ugc:
    required_tools: []
    allowed_roots:
    - product
    publication_paths:
    - product/lightreel-seedance-fal-ugc-workflow.md
    routing:
      owns: The company-input to Lightreel-discovery to Seedance-prompt to fal-payload workflow for single-person
        UGC video generation.
      when_to_use:
      - When runtime provides company facts and the goal is to discover a high-performing creator format before
        generating a Seedance prompt.
      - When a team needs a repeatable framework for turning business context into Lightreel research prompts and
        fal submission payloads.
      - When single-person selfie-style UGC constraints must be preserved across ideation and rendering.
      do_not_use_for:
      - Do not use for final UI implementation, API key storage, or provider-specific secret management.
      - Do not use for product-shot, screen-recording, or multi-actor ad workflows.
  takyon-market-research:
    required_tools:
    - business_read_business
    - business_read_file
    - business_list_files
    - business_write_file
    - business_patch_file
    - business_record_memory
    allowed_roots:
    - research
    - metrics
    publication_paths:
    - research/market.md
    - research/sources.jsonl
    - metrics/research-summary.json
    routing:
      owns: customer, competitor, channel, pricing, and demand evidence
      when_to_use:
      - evidence is weak or stale, especially on `/create`
      - ICP, channel, offer, or pricing decisions need fresh truth
      do_not_use_for:
      - cosmetic copy changes that do not change the business decision
  takyon-meta-ads-v2:
    required_tools:
    - business_read_business
    - business_meta_ad_launch
    - business_meta_ad_control
    - business_meta_ad_insights_sync
    - business_meta_ad_evaluate
    - business_meta_pixel_verify
    - business_meta_pixel_ensure
    allowed_roots:
    - product
    - distribution
    - metrics
    publication_paths:
    - distribution/meta-ads/<slug>/plan.json
    - distribution/meta-ads/<slug>/receipt.json
    - distribution/meta-ads/<slug>/actions/<idempotency>.json
    - metrics/meta-ads/<slug>/insights.jsonl
    - metrics/meta-ads/<slug>/syncs/<idempotency>.json
    - metrics/meta-ads/<slug>/evaluations/<idempotency>.json
    - metrics/meta-pixel/<slug>/preflight.json
    - metrics/meta-pixel/<slug>/ensure.json
    routing:
      owns: Meta ad launch and lifecycle for one business via the hybrid system-user-Graph (media upload) + official-MCP
        (ad objects) path — campaign/adset/ad create, budget set/change, pause, activate, delivery-metrics sync,
        good/bad evaluation, and per-business pixel verify/ensure, from a creative the creative layer already produced.
      when_to_use:
      - a finished image or video creative under product/ needs to launch (or stage paused) as a bounded Meta campaign
      - an existing Meta campaign/adset/ad needs its daily budget changed, pausing, or activation
      - Meta delivery metrics need syncing into Takyon as a durable time-series
      - the operator asks whether a Meta campaign/adset/ad is performing well or poorly and what to do
      - the shared Meta pixel + per-business custom conversion needs verifying or lazily ensuring before a conversion
        launch
      do_not_use_for:
      - choosing image vs video or writing the ad copy (creative-format / ad-copy skills)
      - producing the creative asset itself (ugc-video-ad / static-ad-creative-generator)
      - inventing placeholder, mock, or stub media just to force a launch through
      - hard-deleting campaigns (the MCP cannot delete; pause here, delete in Ads Manager UI)
      - claiming CAC, ROAS, or conversion attribution Takyon has not joined truthfully
  takyon-mobile-app:
    required_tools:
    - business_read_business
    - business_read_store_status
    - business_publish_mobile_release
    - business_claude_agent_task
    - business_read_file
    - business_list_files
    allowed_roots:
    - product
    - metrics
    publication_paths:
    - product/surface.md
    - product/app
    routing:
      owns: The whole iOS App Store surface for a mobile_app business — the Expo app source build, the greenlight
        pre-submission compliance gate, and the credit-gated EAS build → TestFlight → App Store release.
      when_to_use:
      - the business is archetype `mobile_app` and its iOS app source is missing, starter-shaped, or needs a focused
        product pass
      - a mobile_app business is ready to cut a build to TestFlight (lane `preview`) or submit to the App Store
        (lane `production`)
      - the CEO needs to know whether Apple will accept a submission (developer-account health / agreement state)
        before spending on a build
      do_not_use_for:
      - a web_saas or shopify business product surface; that is `takyon-product`
      - app-runtime backend rails (auth, sessions, entitlements, checkout, webhooks, usage budgets); those are `takyon-app-runtime`
        and are SHARED across archetypes
      - selecting or changing a business's archetype; that is set at create time from the archetype registry
  takyon-product:
    required_tools:
    - business_read_business
    - business_upsert_app_surface_contract
    - business_upsert_app_plan
    - business_generate_site_image
    - business_claude_agent_task
    - business_refresh_product_surface
    - business_check_runtime_capabilities
    - business_invoke_app_action
    allowed_roots:
    - product
    - metrics
    publication_paths:
    - product/surface.md
    - product/site
    execution_profiles:
      initial_landing:
        effort: medium
        max_turns: 60
        budget_usd: null
        timeout_ms: 900000
      product_workflow:
        effort: high
        max_turns: 90
        budget_usd: 25.0
        timeout_ms: 1800000
    invariants:
    - preserve_pinned_vite_scaffold
    - preserve_user_plus_entitlements_account_truth
    - forbid_has_active_subscription_gate
    - forbid_nested_subscription_status_gate
    - forbid_ad_hoc_client_account_parsing
    - preserve_canonical_route_skeleton
    - preserve_no_free_tier_and_no_trial
    - preserve_shared_takyon_app_kit
    - native_taste_controls_presentation_not_click_graph
    verification_floors:
    - deterministic_build_and_typecheck_green
    - publication_status_published_with_public_url
    - changed_action_certified_invoked_and_receipted
    routing:
      owns: The whole product surface for one business — first landing/app build, the real gated in-app workflow,
        and surgical follow-up iterations including authoritative pricing changes.
      when_to_use:
      - the landing page or the `/app` auth/subscription shell is missing, weak, or still starter-shaped (first
        build)
      - both `/` and the `/app` shell exist but `/app` has no real post-sign-in product workflow yet (flesh out
        `/app`)
      - the product is already real and one flow, screen, action, conversion step, or price needs a focused pass
        (surgical iterate)
      - pricing or checkout must change against the authoritative plan catalog
      do_not_use_for:
      - market research, ICP, or offer resets that still need fresh evidence first; use `takyon-market-research`
      - app-runtime backend rails (auth, sessions, entitlements, checkout, webhooks, usage budgets); those are `takyon-app-runtime`
  takyon-reddit-ads:
    required_tools:
    - business_read_business
    - business_reddit_ad_launch
    - business_reddit_ad_control
    - business_reddit_ad_insights_sync
    allowed_roots:
    - product
    - distribution
    - metrics
    publication_paths:
    - product/public-assets/<slug>/receipt.json
    - distribution/reddit-ads/<slug>/plan.json
    - distribution/reddit-ads/<slug>/receipt.json
    - distribution/reddit-ads/<slug>/actions/<idempotency>.json
    - metrics/reddit-ads/<slug>/insights.jsonl
    - metrics/reddit-ads/<slug>/syncs/<idempotency>.json
    routing:
      owns: Reddit ad launch staging, explicit control, and ad-platform metrics sync from an existing promoted post,
        a public creative URL, or a local business creative asset staged onto the business publish target
      when_to_use:
      - a finished ad creative needs to be launched or staged as a bounded Reddit campaign
      - a finished local business image or video asset under `product/` needs to be turned into a Reddit promoted
        post safely
      - Reddit auth/default discovery is needed before launch work
      - a launched Reddit ad needs to be activated, paused, or have its daily budget updated
      - Reddit delivery metrics need to be synced into Takyon for later tracking
      do_not_use_for:
      - building the image or video asset itself
      - inventing placeholder, mock, fixture, or stub creative URLs just to force a launch through
      - claiming CAC, ROAS, or conversion attribution Takyon has not joined truthfully
  takyon-x:
    required_tools:
    - business_read_business
    - business_calculate_pulse
    - business_read_file
    - business_list_files
    - business_write_file
    - business_patch_file
    - business_list_conversation_messages
    - business_read_conversation_thread
    - business_x_publish_outreach
    - business_x_search
    - business_record_conversation_message
    - business_update_conversation_message_status
    allowed_roots:
    - distribution
    - metrics
    - research
    publication_paths:
    - distribution/voice/x.md
    - distribution/campaign
    - distribution/local-published
    - metrics/conversations
    routing:
      owns: X posts, replies, thread handling, and durable X voice
      when_to_use:
      - the business needs X-native drafting, posting, or reply handling
      - a wake or campaign turn is clearly X-shaped
      do_not_use_for:
      - broad cross-channel campaign coordination better handled by `takyon-distribution`
  ugc-video-ad:
    required_tools:
    - business_ugc_ad_generate
    - business_ugc_ad_write
    allowed_roots:
    - product
    publication_paths:
    - product/ugc-ads/<slug>/ad.mp4
    - product/ugc-ads/<slug>/script.json
    - product/ugc-ads/<slug>/reference.png
    routing:
      owns: per-business UGC video ad asset generation from brief to finished mp4, script, and reference image
      when_to_use:
      - the business needs a short social talking-head video ad
      - the asset should be published under `product/ugc-ads/` as a business-scoped creative deliverable
      do_not_use_for:
      - screen-recording or UI-demo videos
      - non-business or multi-business assets
