# Takyon environment manifest — DEV (modularization plan §2.6 / Stage 3b, UC3).
#
# This is a DECLARATIVE description of one prod-SHAPED, fully-ISOLATED environment. It
# names the twins the EnvironmentProvisioner stands up; it does NOT contain any secret.
# Every credential resolves at run time via the safebox authority route (never os.environ),
# and the provisioner FAILS CLOSED — naming the exact alias to deposit — when one is absent.
#
# Operator ruling (2026-07-02): DEV GETS ITS OWN SUPABASE PROJECT as its control plane.
# The `database.dsn_env` below therefore points at a SEPARATE Supabase project's migration
# DSN, provisioned with prod-named roles via topology.sql — never dev tables inside prod.
#
# The prod-literal guard (environment.assert_not_prod_leakage / PROD_LITERALS) is armed over
# every resolved target: a dev manifest that resolves a prod IP/host/DSN refuses to provision.

# ── identity ────────────────────────────────────────────────────────────────────────────
name: dev                     # TAKYON_ENV; must not be "prod" (the CLI + provisioner refuse prod)
description: >-
  Prod-shaped, fully-isolated dev environment: own Supabase control plane (prod-named roles),
  own dev safebox, Stripe TEST mode, capped model/media/search keys, dev domains. Runs the real
  gates against twin infrastructure — the same code, differing only in what the slices point at.

# ── domains ─────────────────────────────────────────────────────────────────────────────
# Dev domains are *.dev / localtest — never the prod company base or dashboard host.
domains:
  company_base: dev.coscale.app     # per-business product sites: <slug>.dev.coscale.app
  dashboard_host: ""                # empty = local serving (localhost:9119); set a *.dev host to publish a public twin
  # A public dev twin (DNS + Auth0 callbacks + R2 worker route) is OPTIONAL and gated by
  # cloudflare.enabled below; local serving first (plan Q9 recommendation).

# ── plan caps (hard per-environment budget ceilings; dev spends REAL money on test-mode keys) ──
# These are POLICY, enforced by the runtime spend gates — the provisioner records them into the
# env config so the dev safebox and usage rail cap dev spend independently of prod.
plans:
  # Per-environment monthly budget ceiling for AI/media/search spend across ALL dev businesses.
  # A hard cap so a runaway dev loop cannot burn the shared provider accounts.
  environment_monthly_budget_usd: 50
  # Default subuser plan seed for dev businesses (monthly-only, per operator ruling).
  default_subuser_plan_price_usd: 19
  default_subuser_included_ai_budget_usd: 5

# ── twins to provision ────────────────────────────────────────────────────────────────────
# Each block declares one twin. `enabled: false` skips that step entirely (status still reports it
# as "disabled"). Optional infra (droplet, cloudflare) is OFF by default — local serving first.

# (a) DB — dev's OWN Supabase project as its control plane. topology.sql + run_migrations applied
#     as takyon_migration against the dev migration DSN. The DSN is resolved from the safebox by
#     alias (NEVER a literal in this file), and asserted NOT to be a prod literal before any DDL.
database:
  enabled: true
  provider: supabase                       # documentation: dev has its own Supabase project
  # Safebox alias holding the dev MIGRATION DSN (takyon_migration login). The provisioner resolves
  # this via safebox.first_env_backed_value(...) on the operator-authority host — never os.environ.
  # FAIL-CLOSED message names this exact alias when absent.
  dsn_alias: TAKYON_DEV_MIGRATION_DATABASE_URL
  # Alias holding the dev project's ADMIN DSN (postgres role). topology.sql is privileged work
  # (CREATEROLE + WITH ADMIN OPTION grants) and Postgres refuses those grants from takyon_migration
  # itself. When absent, topology is skipped and run_migrations' topology assertion is the guard —
  # so re-runs on an already-bootstrapped dev DB need no admin credential.
  admin_dsn_alias: TAKYON_DEV_ADMIN_DATABASE_URL
  # Roles are prod-named (topology.sql). No relaxed/legacy role flags in dev — the gate stays enforced.
  apply_topology: true
  apply_migrations: true

# (b) dev safebox — a SECOND instance of our own safebox code with its own token + .env key set.
#     The provisioner VERIFIES the alias set is present (reports which are missing; never invents a
#     value). The dev safebox itself is stood up out of band (its own process/container); this step
#     asserts it holds the aliases the dev runtime will need.
safebox:
  enabled: true
  # Base URL of the DEV safebox instance (asserted NOT to be a prod literal). Resolved from this
  # alias so the value never sits in the manifest.
  url_alias: TAKYON_DEV_SAFEBOX_URL
  # The alias set the dev safebox MUST hold for dev to run prod-shaped. Grouped by purpose. The
  # provisioner reports EACH missing alias with the deposit instruction; it seeds none of them.
  required_aliases:
    # Stripe TEST mode (a built-in parallel universe in the same Stripe account).
    stripe:
      - STRIPE_SECRET_KEY            # MUST be a sk_test_… key in dev (asserted test-mode)
      - STRIPE_WEBHOOK_SECRET        # dev subuser app webhook signing secret (whsec_…)
      - STRIPE_BILLING_WEBHOOK_SECRET  # dev operator/control-plane billing webhook signing secret
    # Capped model / media / search provider keys (shared accounts, dev budget caps per plans.*).
    providers:
      - GEMINI_API_KEY               # or TAKYON_GEMINI_API_KEY / GOOGLE_API_KEY (gemini alias set)
      - FAL_KEY                      # media generation
      - TAVILY_API_KEY               # web search/extract
    # Auth0 dev application (see auth0 block) — the client secret the dev app uses.
    auth0:
      - AUTH0_CLIENT_SECRET
      - AUTH0_SECRET
    # Supabase Auth for the DEV project — the subuser login rail. handle_business_supabase_login
    # verifies product JWTs via app_supabase_auth, which resolves the project URL as SUPABASE_URL
    # and the public/browser key as SUPABASE_ANON_KEY (both vendable public config, never the
    # service-role key). Without these the dev twin has NO session-minting rail, so `takyon env
    # status dev` must truthfully report them missing until the dev project's values are deposited.
    supabase_auth:
      - SUPABASE_URL                 # the DEV Supabase project URL (https://<ref>.supabase.co)
      - SUPABASE_ANON_KEY            # the DEV project's anon/publishable browser key

# (c) Auth0 dev APPLICATION — a new application (client id/secret, callback URLs) in the SAME tenant,
#     created via the Management API. The mgmt credential is the one the safebox does NOT hold by
#     default (plan §2.6): a human deposits it once, then this is autonomous. Two accepted shapes:
#     the DURABLE one is an M2M app authorized for the Management API (client id+secret; the
#     provisioner mints a fresh ~24h token per run via client_credentials), the transient one is a
#     raw mgmt token. FAIL-CLOSED naming the exact aliases when neither is deposited.
auth0:
  enabled: true
  # Durable deposit (preferred): M2M application credentials, minted per run.
  mgmt_client_id_alias: TAKYON_AUTH0_MGMT_CLIENT_ID
  mgmt_client_secret_alias: TAKYON_AUTH0_MGMT_CLIENT_SECRET
  # Transient deposit (one-shot runs): a raw Management API token (~24h expiry).
  mgmt_token_alias: TAKYON_AUTH0_MGMT_TOKEN
  # Alias holding the CANONICAL Auth0 tenant domain (e.g. dev-xxxx.us.auth0.com). Deliberately NOT
  # the shared AUTH0_DOMAIN alias — that one holds the dashboard's custom login domain
  # (login.fourmanifold.com), and Management API token minting requires the canonical tenant domain
  # as its audience. Public config, still resolved from the safebox so the manifest stays value-free.
  domain_alias: TAKYON_AUTH0_TENANT_DOMAIN
  application_name: "Takyon Dev"
  # Callback / logout URLs the dev application allows. Local-serving defaults; extend for a public twin.
  callback_urls:
    - http://localhost:9119/callback
    - http://localhost:9119/api/auth/callback
  logout_urls:
    - http://localhost:9119
  web_origins:
    - http://localhost:9119

# (d) Cloudflare dev DNS / R2 — OPTIONAL (off by default; local serving first, plan Q9). When enabled,
#     creates *.dev DNS records + a second R2 bucket + a worker route in the SAME Cloudflare account.
#     The safebox ALREADY holds CLOUDFLARE_API_TOKEN (used by the prod product-edge-route today).
cloudflare:
  enabled: false
  token_alias: CLOUDFLARE_API_TOKEN
  zone_name: dev.coscale.app
  r2_bucket: takyon-dev-product           # a second bucket, isolated from prod's
  edge_worker: takyon-product-worker-dev  # a dev worker route

# (e) Stripe TEST webhook — register a webhook endpoint against the TEST-mode Stripe key (the safebox
#     holds STRIPE_SECRET_KEY; the provisioner asserts it is a test key before registering).
stripe:
  enabled: true
  # Where Stripe should deliver dev webhook events. Local serving = a tunnel/localhost; a public twin
  # would use the dev dashboard host. Asserted NOT to be a prod literal.
  webhook_url: http://localhost:9119/api/webhooks/stripe
  # Event types the dev endpoint subscribes to (mirrors the prod subuser app webhook surface).
  enabled_events:
    - checkout.session.completed
    - customer.subscription.updated
    - customer.subscription.deleted
    - invoice.paid
    - invoice.payment_failed

# (f) DigitalOcean dev split (Stage 4b) — the two-replica subuser plane behind a VPC LB, plus the
#     singleton dev safebox host. Operator approved the recurring dev cost (2026-07-02, ~$30/mo
#     scale, smallest viable sizes, destroyable). Every resource is tagged `takyon-env-dev`;
#     `takyon env destroy dev --force` sweeps exactly the tagged set (plus the named ssh key/vpc,
#     which DO cannot tag). The token deposit is TAKYON_DO_API_TOKEN — one deposit, autonomous after.

# (f1) Dedicated VPC — dev droplets NEVER join the prod VPC (10.116.0.0/20); the prod-literal guard
#      also refuses any resolved prod address.
vpc:
  enabled: true
  name: takyon-dev-vpc
  region: nyc3
  ip_range: 10.200.0.0/24

# (f2) Dedicated deploy key (public half only; generate with
#      `ssh-keygen -t ed25519 -N '' -f ~/.ssh/takyon_dev_split`).
ssh_key:
  enabled: true
  name: takyon-dev-split
  public_key_path: ~/.ssh/takyon_dev_split.pub

# (f3) Replicated subuser droplets + the singleton dev safebox host (the secret authority is
#      deliberately NOT replicated — plan §2.5). Smallest sizes that fit the runtime.
droplets:
  enabled: true
  count: 2
  role: subuser
  name_prefix: takyon-dev-subuser
  size: s-1vcpu-2gb            # 2 uvicorn workers of the app plane need >1GB headroom
  region: nyc3
  token_alias: TAKYON_DO_API_TOKEN
  safebox_host:
    enabled: true
    name: takyon-dev-safebox
    size: s-1vcpu-1gb          # safebox_app is lighter; VPC-internal only (:8000 via the firewall)
  # (f7) Per-replica SCOPED, REVOCABLE credentials (Stage 4b hardening bullet). create() enrolls
  # each replica with its OWN DB login role (takyon_app_runtime__<node>, an INHERIT member of the
  # ONE canonical app-plane role) and its OWN safebox transport token (the safebox host stores
  # only sha256 digests in node_tokens_file; the shared token stays valid for non-split hosts).
  # Compromising one replica therefore never yields a credential that outlives it:
  # `takyon env revoke-node dev <node>` DROPs the role + prunes the digest — refused everywhere
  # within one request; re-enroll with `takyon env create dev`; activate env changes with the
  # drain rail (`takyon env restart dev`). Values below are the defaults, declared for the record.
  runtime_dsn_alias: TAKYON_DEV_RUNTIME_DATABASE_URL   # shared alias scoped DSNs derive from
  safebox_token_alias: TAKYON_DEV_SAFEBOX_TOKEN        # shared transport token (kept valid)
  env_file: /opt/takyon/.takyon/.env                   # replica env the scoped creds land in
  node_tokens_file: /opt/takyon/.takyon/safebox/node_tokens.json  # digests only, never values

# (f4) VPC load balancer fronting the replicas BY ROLE TAG (takyon-env-dev-subuser): a future
#      replica joins by tag, no LB edit. Targets each replica's Caddy on :80 (prod topology:
#      uvicorn stays on loopback behind Caddy — deploy/takyon-dev-split/Caddyfile.dev), health-
#      checked on the app plane's /healthz through that same front.
load_balancer:
  enabled: true
  name: takyon-dev-subuser-lb
  region: nyc3
  forwarding_rules:
    - entry_port: 80
      entry_protocol: http
      target_port: 80
      target_protocol: http
  health_check:
    protocol: http
    port: 80
    path: /healthz
    # Tight eviction: a hard-killed replica black-holes leastconn traffic until eviction, so
    # keep the detection window small (~2×3s; measured 36s at the DO defaults of 3×10s).
    check_interval_seconds: 3
    response_timeout_seconds: 3
    unhealthy_threshold: 2
    healthy_threshold: 2

# (f5) Firewall over every takyon-env-dev droplet: :22 only from the operator CIDR deposited under
#      ssh_allow_alias (fail-closed — no deposit, no firewall, never an open :22), :80/:9119 only
#      from the LB + the env's own droplets, :8000 (dev safebox) only from the env's own droplets.
firewall:
  enabled: true
  name: takyon-dev-split-fw
  ssh_allow_alias: TAKYON_DEV_SSH_ALLOW_CIDR

# (f6) Drain-aware rolling restart — `takyon env restart dev` (the full-4b graceful-drain rail).
#      Planned restarts/deploys lose ZERO requests: per replica the provisioner removes the node
#      from the LB, waits out in-flight requests, converges the tracked Caddy front
#      (deploy/takyon-dev-split/Caddyfile.dev — carries the X-Takyon-Node identity header),
#      restarts the unit, health-verifies locally (:9119 + :80), re-adds it, and only proceeds
#      once the LB provably routes to it again. Fail-closed: refuses to drain a replica unless
#      every other replica is a healthy LB member. (Checked against the live DO v2 API: this LB
#      type exposes no draining state and no per-member health — hence the remove→grace→re-add
#      flow and the header-based rejoin proof.)
rolling_restart:
  # Seconds to wait for in-flight requests after the LB confirms the node out of the member set.
  grace_seconds: 8
  # Ceiling on the rejoin gate (LB health check re-admission is ~2×3s per f4 above).
  rejoin_timeout_seconds: 120
  # systemd unit restarted on each replica (defaults to takyon-<role>.service).
  service: takyon-subuser.service
