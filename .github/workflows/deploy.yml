name: Deploy Takyon

# Push triggers OFF while GitHub Actions billing is dead (operator, 2026-07-04):
# every push spawned an instant job-start failure ("recent account payments have
# failed"), and prod deploys are LOCAL tracked scripts anyway (runners cannot SSH
# through the firewall). Re-enable push triggers when billing is restored.
on:
  workflow_dispatch:

concurrency:
  group: takyon-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAKYON_REMOTE_RUNTIME: /opt/takyon/hermes-agent-main
      TAKYON_SMOKE_HOST: https://app.fourmanifold.com/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hermes-agent-main/web/package-lock.json

      - name: Build dashboard UI
        run: npm ci && npm run build
        working-directory: hermes-agent-main/web

      - name: Compile Python runtime
        run: |
          python -m compileall -q \
            hermes-agent-main/plugins/takyon \
            hermes-agent-main/takyon_cli \
            hermes-agent-main/tui_gateway

      - name: Detect tracked Caddy changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "operator_caddy=0" >> "$GITHUB_OUTPUT"
            echo "subuser_caddy=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx 'deploy/argon-alpha-14/Caddyfile'; then
            echo "operator_caddy=1" >> "$GITHUB_OUTPUT"
          else
            echo "operator_caddy=0" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx 'deploy/takyon-subuser/Caddyfile'; then
            echo "subuser_caddy=1" >> "$GITHUB_OUTPUT"
          else
            echo "subuser_caddy=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Safebox VPS SSH key
        id: safebox_ssh
        shell: bash
        env:
          TAKYON_SAFEBOX_VPS_HOST: ${{ secrets.TAKYON_SAFEBOX_VPS_HOST }}
          TAKYON_SAFEBOX_VPS_USER: ${{ secrets.TAKYON_SAFEBOX_VPS_USER }}
          TAKYON_SAFEBOX_VPS_SSH_KEY: ${{ secrets.TAKYON_SAFEBOX_VPS_SSH_KEY }}
        run: |
          if [[ -z "${TAKYON_SAFEBOX_VPS_HOST:-}" || -z "${TAKYON_SAFEBOX_VPS_SSH_KEY:-}" ]]; then
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "reachable=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TAKYON_SAFEBOX_VPS_SSH_KEY" > "$HOME/.ssh/takyon_safebox"
          chmod 600 "$HOME/.ssh/takyon_safebox"
          ssh-keyscan -T 10 -H "$TAKYON_SAFEBOX_VPS_HOST" >> "$HOME/.ssh/known_hosts" || \
            echo "ssh-keyscan failed for $TAKYON_SAFEBOX_VPS_HOST; continuing because deploy commands use StrictHostKeyChecking=accept-new" >&2
          echo "TAKYON_SAFEBOX_DEPLOY_HOST=${TAKYON_SAFEBOX_VPS_USER:-root}@$TAKYON_SAFEBOX_VPS_HOST" >> "$GITHUB_ENV"
          echo "TAKYON_SAFEBOX_DEPLOY_KEY=$HOME/.ssh/takyon_safebox" >> "$GITHUB_ENV"
          echo "configured=1" >> "$GITHUB_OUTPUT"
          if nc -z -w 5 "$TAKYON_SAFEBOX_VPS_HOST" 22; then
            echo "reachable=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Safebox VPS SSH is not reachable from this GitHub runner; skipping remote deploy."
            echo "reachable=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare VPS SSH key
        id: operator_ssh
        shell: bash
        env:
          TAKYON_VPS_HOST: ${{ secrets.TAKYON_VPS_HOST }}
          TAKYON_VPS_USER: ${{ secrets.TAKYON_VPS_USER }}
          TAKYON_VPS_SSH_KEY: ${{ secrets.TAKYON_VPS_SSH_KEY }}
        run: |
          test -n "$TAKYON_VPS_HOST"
          test -n "$TAKYON_VPS_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TAKYON_VPS_SSH_KEY" > "$HOME/.ssh/takyon_argon_alpha14"
          chmod 600 "$HOME/.ssh/takyon_argon_alpha14"
          ssh-keyscan -T 10 -H "$TAKYON_VPS_HOST" >> "$HOME/.ssh/known_hosts" || \
            echo "ssh-keyscan failed for $TAKYON_VPS_HOST; continuing because deploy commands use StrictHostKeyChecking=accept-new" >&2
          echo "TAKYON_VPS_HOST=${TAKYON_VPS_USER:-root}@$TAKYON_VPS_HOST" >> "$GITHUB_ENV"
          echo "TAKYON_VPS_KEY=$HOME/.ssh/takyon_argon_alpha14" >> "$GITHUB_ENV"
          if nc -z -w 5 "$TAKYON_VPS_HOST" 22; then
            echo "reachable=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Operator VPS SSH is not reachable from this GitHub runner; skipping remote deploy."
            echo "reachable=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Safebox runtime to VPS
        if: steps.safebox_ssh.outputs.configured == '1' && steps.safebox_ssh.outputs.reachable == '1'
        env:
          TAKYON_RUN_WEB_BUILD: "1"
          TAKYON_VPS_HOST: ${{ env.TAKYON_SAFEBOX_DEPLOY_HOST }}
          TAKYON_VPS_KEY: ${{ env.TAKYON_SAFEBOX_DEPLOY_KEY }}
        run: deploy/takyon-safebox/deploy-runtime.sh

      - name: Redeploy Vercel frontdoor
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "VERCEL_TOKEN is not configured; skipping Vercel redeploy."
            exit 0
          fi
          scope_args=()
          if [[ -n "${VERCEL_SCOPE:-}" ]]; then
            scope_args=(--scope "$VERCEL_SCOPE")
          fi
          npx --yes vercel@latest redeploy app.fourmanifold.com --target production --token "$VERCEL_TOKEN" "${scope_args[@]}"
          npx --yes vercel@latest inspect app.fourmanifold.com --token "$VERCEL_TOKEN" "${scope_args[@]}"

      - name: Deploy runtime to VPS
        if: steps.operator_ssh.outputs.reachable == '1'
        env:
          TAKYON_APPLY_CADDY: ${{ steps.changes.outputs.operator_caddy }}
          TAKYON_RUN_WEB_BUILD: "1"
        run: deploy/argon-alpha-14/deploy-runtime.sh

      - name: Prepare sub-user VPS SSH key
        id: subuser_ssh
        shell: bash
        env:
          TAKYON_SUBUSER_VPS_HOST: ${{ secrets.TAKYON_SUBUSER_VPS_HOST }}
          TAKYON_SUBUSER_VPS_USER: ${{ secrets.TAKYON_SUBUSER_VPS_USER }}
          TAKYON_SUBUSER_VPS_SSH_KEY: ${{ secrets.TAKYON_SUBUSER_VPS_SSH_KEY }}
        run: |
          if [[ -z "${TAKYON_SUBUSER_VPS_HOST:-}" || -z "${TAKYON_SUBUSER_VPS_SSH_KEY:-}" ]]; then
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "reachable=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TAKYON_SUBUSER_VPS_SSH_KEY" > "$HOME/.ssh/takyon_subuser"
          chmod 600 "$HOME/.ssh/takyon_subuser"
          ssh-keyscan -T 10 -H "$TAKYON_SUBUSER_VPS_HOST" >> "$HOME/.ssh/known_hosts" || \
            echo "ssh-keyscan failed for $TAKYON_SUBUSER_VPS_HOST; continuing because deploy commands use StrictHostKeyChecking=accept-new" >&2
          echo "TAKYON_SUBUSER_DEPLOY_HOST=${TAKYON_SUBUSER_VPS_USER:-root}@$TAKYON_SUBUSER_VPS_HOST" >> "$GITHUB_ENV"
          echo "TAKYON_SUBUSER_DEPLOY_KEY=$HOME/.ssh/takyon_subuser" >> "$GITHUB_ENV"
          echo "configured=1" >> "$GITHUB_OUTPUT"
          if nc -z -w 5 "$TAKYON_SUBUSER_VPS_HOST" 22; then
            echo "reachable=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sub-user VPS SSH is not reachable from this GitHub runner; skipping remote deploy."
            echo "reachable=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy sub-user runtime to VPS
        if: steps.subuser_ssh.outputs.configured == '1' && steps.subuser_ssh.outputs.reachable == '1'
        env:
          TAKYON_APPLY_CADDY: ${{ steps.changes.outputs.subuser_caddy }}
          TAKYON_RUN_WEB_BUILD: "1"
          TAKYON_VPS_HOST: ${{ env.TAKYON_SUBUSER_DEPLOY_HOST }}
          TAKYON_VPS_KEY: ${{ env.TAKYON_SUBUSER_DEPLOY_KEY }}
        run: deploy/takyon-subuser/deploy-runtime.sh
