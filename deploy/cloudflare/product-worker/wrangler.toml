# Cloudflare Worker that serves Takyon product static sites from R2 at the edge
# and forwards everything else (/api/* and reserved operator hosts) to the real
# origin (operator Caddy at 137.184.75.57) unchanged.
#
# Deploy:  wrangler deploy        (see README.md)
# Tail:    wrangler tail takyon-product-worker

name = "takyon-product-worker"
main = "worker.js"
compatibility_date = "2025-06-01"

# ── R2 binding ──────────────────────────────────────────────────────────────
# Read-only at runtime (the worker only GETs `<slug>/current` and
# `<slug>/<build_id>/<rel>`). The bucket holds ONLY public built dist; nothing
# private is ever written here. The publish side (VPS) writes with an S3 token
# resolved via the env-backed/TK pattern, NOT through this worker.
[[r2_buckets]]
binding = "PRODUCT_SITES"
bucket_name = "product-sites"

# ── Origin pin ──────────────────────────────────────────────────────────────
# Grey-clouded (DNS-only, NOT proxied) hostname that resolves to the VPS and is
# NOT itself on this Worker's route, so the passthrough subrequest reaches the
# real origin instead of re-entering the Worker. The original Host header is
# preserved, so Caddy still matches the per-business product block and serves the
# Cloudflare origin cert. See README.md "API passthrough" for the DNS record.
[vars]
ORIGIN_HOST = "origin.coscale.app"

# ── Routes ──────────────────────────────────────────────────────────────────
# Routes are intentionally managed by the Takyon publish path, not by `wrangler deploy`:
# `plugins/takyon/core.py::_ensure_product_edge_route` creates per-business routes such as
# `wandr.coscale.app/*` in the coscale.app zone. Per-business routes keep `origin.coscale.app`
# outside this Worker, which is required for `/api/*` passthrough via `resolveOverride`.
#
# If you intentionally choose a wildcard route (`*.coscale.app/*`) in Cloudflare, first add a
# more-specific `origin.coscale.app/*` route mapped to NO worker so passthrough cannot loop.
