# Named operator profiles for scripts/takyon-operator-prod.sh
#
# Add a teammate with ONE line: "<name> <takyon-operator-user-id>"
# Then run:  scripts/takyon-operator-prod.sh <name>
#            (= console 4 --user-id <that uuid> --shells 4)
# or:        scripts/takyon-operator-prod.sh console 4 --user <name> --shells 4
#
# Names defined directly in the script (resolve_operator_alias) win; this file is for
# additions/overrides. Lines starting with '#' and blank lines are ignored.
#
# Examples (already built into the script, shown here for reference):
#   sai   c351355a-34f4-4885-8c60-429bf79bd7a5
#   josh  150e4213-4006-4dc1-9cf3-ca7ab3b4696f
